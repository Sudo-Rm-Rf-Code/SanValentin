<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pregunta Importante</title>
    <style>
        body { 
            background-color: #000; 
            color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden; 
            padding: 20px;
            text-align: center;
            transition: background-color 0.5s; 
        }

        h1 { margin-bottom: 20px; font-size: 2rem; z-index: 100; }

        .img-container img {
            width: 180px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            width: 100%;
            position: relative; /* Base para que las capas funcionen */
        }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
        }

        /* El SÍ empieza con z-index bajo para estar detrás */
        #si { 
            background-color: #22c55e; 
            color: #000; 
            z-index: 1; 
            position: relative;
        }
        
        /* El NO empieza con z-index más alto para estar al frente */
        #no { 
            background-color: #ef4444; 
            color: #fff; 
            z-index: 10; 
            position: relative;
        }
    </style>
</head>
<body>

    <div class="img-container">
        <img src="https://media.tenor.com/gUiu1zyxfzYAAAAi/bear-kiss-bear-kisses.gif" alt="Osos">
    </div>

    <h1>¿Quieres ser mi San Valentín? ❤️</h1>

    <div class="btn-container">
        <button id="si" onclick="aceptar()">SÍ</button>
        <button id="no" onclick="agrandar()">NO</button>
    </div>

    <script>
        let escalaSi = 1;
        let opacidadNo = 1;

        function agrandar() {
            escalaSi += 0.5; // Crece rápido para alcanzar al NO
            opacidadNo -= 0.15;

            const btnSi = document.getElementById('si');
            const btnNo = document.getElementById('no');

            btnSi.style.transform = `scale(${escalaSi})`;
            btnNo.style.opacity = opacidadNo;
            
            // Lógica de frases y el "salto" de capa final
            if (escalaSi > 2.5) {
                btnSi.innerText = "¡SÍÍÍÍ! 💍";
                btnSi.style.zIndex = "100"; // Aquí el SÍ pasa al frente y tapa al NO
            } else if (escalaSi > 2.0) {
                btnSi.innerText = "¡DAME EL SÍ! 😏";
            } else if (escalaSi > 1.6) {
                btnSi.innerText = "No vale arrepentirse...";
            } else if (escalaSi > 1.2) {
                btnSi.innerText = "¿Segura? 🥺";
            }
        }

        function aceptar() {
            document.body.innerHTML = `
                <div style="animation: appear 1s ease-in-out;">
                    <h1 style="font-size: 3rem;">😏</h1>
                    <h1>Sabia que ibas a decir que si</h1>
                    <img src="https://media.tenor.com/ivKWdfdbV3EAAAAi/bear-kiss-bear-kisses.gif" style="width: 250px; border-radius: 15px; margin-top:20px;">
                    <p style="font-size: 1.2rem; margin-top: 20px;">(Era la única opción lógica bb)</p>
                </div>
            `;
            document.body.style.backgroundColor = "#ffc0cb"; 
            document.body.style.color = "#d6004f"; 
        }
    </script>
</body>
</html>
